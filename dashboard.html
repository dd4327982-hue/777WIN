<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Gaming Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: #020617;
            background-image: 
                radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.12) 0px, transparent 50%);
            min-height: 100vh;
            color: #f8fafc;
            padding-bottom: 50px;
        }

        header {
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 900;
            font-size: 16px;
            border: 2px solid #fff;
        }

        .wallet-box {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 4px 10px;
        }

        .wallet-title {
            font-size: 9px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .wallet-balance {
            font-size: 13px;
            font-weight: 800;
            color: #4ade80;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-deposit {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #fff;
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #000;
        }

        .notice-banner {
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            font-size: 12px;
            color: #fbbf24;
            display: flex;
            gap: 8px;
            overflow: hidden;
        }

        .categories-container {
            padding: 15px 16px 10px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .category-tab {
            padding: 10px 18px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }

        .category-tab.active {
            background: rgba(251, 191, 36, 0.25);
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .games-section { padding: 12px 16px; }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 15px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .game-thumb {
    height: 140px;
    width: 100%;
    position: relative;
    overflow: hidden;
    background: #000;
    border-radius: 8px;
}

.game-thumb img {
    width: 100%;
    height: 100% !important;
    object-fit: cover !important;
    object-position: center !important;
    transform: none !important;
    box-sizing: border-box;
}
  
.game-thumb .badge-container {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    display: flex;
    justify-content: space-between;
    z-index: 2;
}
        .badge {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            font-size: 9px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            height: fit-content;
        }

        .multiplier {
            background: rgba(34, 197, 94, 0.3);
            border: 1px solid #4ade80;
            color: #4ade80;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            height: fit-content;
        }

        .game-info {
            padding: 10px;
            background: rgba(2, 6, 23, 0.95);
        }

        .game-name {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        .btn-play {
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
        }
      /* Premium Background & Glowing Theme */
body {
    background: #0a0b0d !important;
    background-image: 
        radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
        linear-gradient(180deg, #0f1015 0%, #070709 100%) !important;
    background-attachment: fixed !important;
    color: #ffffff;
}

/* Category Tabs Golden Glow */
.category-tab {
    border: 1px solid rgba(212, 175, 55, 0.2) !important;
    background: rgba(255, 255, 255, 0.04) !important;
    transition: all 0.3s ease;
}

.category-tab.active {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.3) 0%, rgba(255, 215, 0, 0.1) 100%) !important;
    border: 1px solid #d4af37 !important;
    color: #fff7d6 !important;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.4) !important;
}

/* Golden Buttons Style */
.btn-action, .btn-play {
    background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%) !important;
    color: #000000 !important;
    font-weight: 700 !important;
    border: none !important;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3) !important;
}

/* Game Card VIP Border */
.game-card {
    border: 1px solid rgba(212, 175, 55, 0.25) !important;
    background: rgba(20, 22, 31, 0.8) !important;
    backdrop-filter: blur(8px);
}
/* User Profile Modal Styling */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: #12141d;
    border: 1px solid #d4af37;
    width: 90%;
    max-width: 420px;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
    color: #fff;
    position: relative;
}

.close-btn {
    position: absolute;
    top: 15px; right: 15px;
    font-size: 22px; cursor: pointer;
    color: #d4af37;
}

.profile-header {
    text-align: center;
    margin-bottom: 20px;
}

.profile-avatar {
    font-size: 40px;
    background: rgba(212, 175, 55, 0.15);
    width: 70px; height: 70px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 10px;
    border: 2px solid #d4af37;
}

.uid-box {
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    display: inline-block;
    color: #fcf6ba;
    border: 1px solid rgba(212, 175, 55, 0.3);
}

.history-tabs {
    display: flex; gap: 8px;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    padding-bottom: 10px;
}

.h-tab {
    flex: 1; padding: 8px 4px;
    font-size: 12px; text-align: center;
    background: rgba(255,255,255,0.05);
    border-radius: 6px; cursor: pointer;
    border: 1px solid transparent;
}

.h-tab.active {
    background: linear-gradient(135deg, #bf953f 0%, #b38728 100%);
    color: #000; font-weight: bold;
}

.history-list {
    max-height: 200px;
    overflow-y: auto;
    font-size: 13px;
}

.history-item {
    display: flex; justify-content: space-between;
    padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05);
}

.status-success { color: #4CAF50; }
.status-fail { color: #F44336; }

  .modal-overlay {

    justify-content: center;
}

        function renderGames(filter = 'hot') {
    const grid = document.getElementById('gamesGrid');
    if (!grid) return;
    grid.innerHTML = '';

    // Active Tab Highlight
    const tabs = document.querySelectorAll('.category-tab');
    tabs.forEach(tab => {
        tab.classList.remove('active');
        if (tab.getAttribute('onclick') && tab.getAttribute('onclick').toLowerCase().includes(filter.toLowerCase())) {
            tab.classList.add('active');
        }
    });

    // Sub-string / Case-Insensitive Matching
    const searchTarget = filter.toLowerCase().trim();

    const list = games.filter(g => {
        if (!g.cat) return false;
        const category = g.cat.toLowerCase().trim();

        // 1. Hot Games
        if (searchTarget === 'hot') return category === 'hot';

        // 2. Fishing Games (handles 'fishing', 'Fishing', 'fish', etc.)
        if (searchTarget.includes('fish') || category.includes('fish')) {
            if (searchTarget.includes('fish') && category.includes('fish')) return true;
        }

        // 3. Live Casino & Cards (handles 'live casino', 'casino', 'cards')
        if (searchTarget.includes('casino') || searchTarget.includes('card')) {
            if (category.includes('casino') || category.includes('card')) return true;
        }

        // 4. General match (exact match or partial match)
        return category === searchTarget || category.includes(searchTarget) || searchTarget.includes(category);
    });

    // Title Update
    const catTitle = document.getElementById('catTitle');
    if (catTitle) {
        catTitle.innerText = `${filter.toUpperCase()} GAMES`;
    }

    // Grid Layout (2 Columns)
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
    grid.style.gap = '12px';

    // Game Cards Render
    list.forEach(g => {
        grid.innerHTML += `
            <div class="game-card">
                <div class="game-thumb">
                    <div class="badge-container">
                        <span class="badge ${(g.badge || '').toLowerCase()}">${g.badge || ''}</span>
                        <span class="multiplier">${g.mult || ''}</span>
                    </div>
                    <img src="${g.img}" alt="${g.name}">
                </div>
                <div class="game-info">
                    <div class="game-name">${g.name}</div>
                    <button class="btn-play" onclick="window.launchGame('${g.file}')">PLAY NOW</button>
                </div>
            </div>
        `;
    });
}
window.launchGame = function(file) {
    if (file) {
        window.location.href = file;
    }
};

window.openDeposit = function() {
    const modal = document.getElementById('depositModal');
    if (modal) {
        modal.style.display = 'flex';
    }
};
  // Close Deposit Modal
window.closeDeposit = function() {
    const modal = document.getElementById('depositModal');
    if (modal) {
        modal.style.display = 'none';
    }
};
// Submit Deposit Form Logic to Termux Server
window.submitDeposit = async function(event) {
    event.preventDefault();

    const amount = document.getElementById('depositAmount').value;
    const utr = document.getElementById('depositutr').value;

    if (!amount || !utr || utr.length !== 12 || isNaN(utr)) {
        alert('Kripya valid 12-digit numeric UTR number enter karein!');
        return;
    }

    try {
        const response = await fetch('http://192.168.1.3:5001/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount, utr })
        });

        const data = await response.json();

        if (data.status === 'success') {
            alert('Deposit request submitted successfully!');
            document.getElementById('depositForm').reset();
            if (typeof closeDeposit === 'function') {
                closeDeposit();
            }
        } else {
            alert('Error: ' + data.message);
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Network error! Check your internet connection.');
    }
};

window.openProfile = function() {
    const modal = document.getElementById('profileModal');
    if (modal) {
        modal.style.display = 'flex';
        switchHistory('bets');
    }
};

// Close Profile Modal
window.closeProfile = function() {
    const modal = document.getElementById('profileModal');
    if (modal) {
        modal.style.display = 'none';
    }
};

// History Tab Switching Logic
window.switchHistory = function(type) {
    const tabs = document.querySelectorAll('.h-tab');
    tabs.forEach(tab => tab.classList.remove('active'));
    
    if (window.event && window.event.target) {
        window.event.target.classList.add('active');
    }

    const contentDiv = document.getElementById('historyContent');
    if (!contentDiv) return;
    
    if (type === 'bets') {
        contentDiv.innerHTML = `<div style="text-align: center; color: #888; padding: 20px 0;">No Bets Placed Yet</div>`;
    } else if (type === 'deposit') {
        contentDiv.innerHTML = `<div style="text-align: center; color: #888; padding: 20px 0;">No Deposit History</div>`;
    } else if (type === 'withdraw') {
        contentDiv.innerHTML = `<div style="text-align: center; color: #888; padding: 20px 0;">No Withdrawal History</div>`;
    }
};
