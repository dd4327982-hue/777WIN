<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-box {
            text-align: center;
            background: #0a0a0a;
            border: 2px solid #ef4444;
            border-radius: 20px;
            padding: 30px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
        }

        .plane-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 900;
            color: #ef4444;
            font-style: italic;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .status {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .btn-back {
            padding: 12px 24px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-box">
        <!-- SVG Red Aviator Plane Icon -->
    <img src="aviator.png" alt="Aviator Logo" style="width: 180px; max-width: 80%; margin-bottom: 20px;">
    <div class="logo-text">Aviator</div>
    <div class="status">Multiplier Algorithm Screen Ready</div>
    <button class="btn-back" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
     </div>

</body>
</html>
