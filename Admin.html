<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Admin Portal</title>
    <style>
        body { background: #0f1215; color: #fff; font-family: sans-serif; padding: 20px; }
        .lock-screen { display: flex; flex-direction: column; align-items: center; justify-content: height: 80vh; margin-top: 100px; }
        .admin-panel { display: none; }
        input, button { padding: 10px; margin: 5px; border-radius: 8px; border: none; }
        button { background: #ffd700; color: #000; font-weight: bold; cursor: pointer; }
        .request-card { background: #1a1f24; padding: 15px; margin-bottom: 15px; border-radius: 10px; border-left: 5px solid #ffd700; }
    </style>
</head>
<body>

    <!-- Security Lock Screen (Password Protection) -->
    <div id="lockScreen" class="lock-screen">
        <h2>🔒 Restricted Admin Access</h2>
        <p>Enter Master Password to Unlock</p>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button onclick="checkAdminPassword()">Access Portal</button>
    </div>

    <!-- Main Admin Dashboard (Hidden by default) -->
    <div id="adminPanel" class="admin-panel">
        <h1>👑 Admin Control Panel</h1>
        <div id="requestsContainer">
            <!-- Dynamic Deposit & Withdrawal requests yahan aayengi -->
        </div>
    </div>

    <script>
    function checkAdminPassword() {
        const pass = document.getElementById('adminPass').value;
        if (pass === "admin123") { // Yahan apna password change kar sakta hai
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadAdminRequests();
            // Har 3 second me auto-refresh hoga taaki naye requests turant dikhein
            setInterval(loadAdminRequests, 3000);
        } else {
            alert("Wrong Password! Access Denied.");
        }
    }

    async function loadAdminRequests() {
        try {
            const response = await fetch('http://localhost:3000/admin/requests');
            const requests = await response.json();
            
            const container = document.getElementById('requestsContainer');
            container.innerHTML = '';

            if (requests.length === 0) {
                container.innerHTML = '<p style="color: #888;">No pending requests right now.</p>';
                return;
            }

            requests.forEach(req => {
                const card = document.createElement('div');
                card.className = 'request-card';
                card.innerHTML = `
                    <p><b>Type:</b> <span style="color: ${req.type === 'Deposit' ? '#00ffcc' : '#ff4d4d'}">${req.type}</span></p>
                    <p><b>Username:</b> ${req.username}</p>
                    <p><b>Amount:</b> ₹${req.amount}</p>
                    <p><b>UTR (Deposit):</b> ${req.utr}</p>
                    <p><b>UPI (Withdrawal):</b> ${req.upi}</p>
                    <p><b>Status:</b> <span style="color: #ffd700;">${req.status}</span></p>
                    ${req.status === 'Pending' ? `
                        <button onclick="handleAction(${req.id}, 'Accept')" style="background: #28a745; color: #fff;">Accept</button>
                        <button onclick="handleAction(${req.id}, 'Reject')" style="background: #dc3545; color: #fff;">Reject</button>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        } catch (error) {
            console.error('Error loading requests:', error);
        }
    }

    async function handleAction(requestId, action) {
        try {
            const response = await fetch('http://localhost:3000/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requestId, action })
            });

            const data = await response.json();
            alert(data.message);
            loadAdminRequests(); // Turant list refresh karo
        } catch (error) {
            console.error('Error executing action:', error);
            alert('Failed to process action.');
        }
    }
</script>

</body>
</html>
